<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="4-7-8 breathing exercise: inhale for 4, hold for 7, exhale for 8">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- radiating breath rings -->
  <g fill="none" stroke="#9ae6d8" stroke-opacity="0.12">
    <circle cx="600" cy="315" r="70"/>
    <circle cx="600" cy="315" r="115"/>
    <circle cx="600" cy="315" r="215"/>
    <circle cx="600" cy="315" r="260"/>
  </g>

  <!-- glow behind orb -->
  <circle cx="600" cy="315" r="180" fill="url(#glow)" filter="url(#soft)"/>

  <!-- breathing orb: 4s expand, 7s hold, 8s contract -->
  <circle cx="600" cy="315" fill="#4fd1c5" fill-opacity="0.9">
    <animate attributeName="r"
      dur="19s" repeatCount="indefinite"
      keyTimes="0;0.2105;0.5789;1"
      values="70;165;165;70"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <animate attributeName="fill-opacity"
      dur="19s" repeatCount="indefinite"
      keyTimes="0;0.2105;0.5789;1"
      values="0.9;0.55;0.55;0.9"/>
  </circle>

  <!-- phase arcs (4 : 7 : 8 of the circle) -->
  <g fill="none" stroke-width="14" stroke-linecap="round">
    <path d="M600,145 A170,170 0 0 1 764.8,273.3" stroke="#4fd1c5"/>
    <path d="M764.8,273.3 A170,170 0 0 1 519.1,464.5" stroke="#f6ad55"/>
    <path d="M519.1,464.5 A170,170 0 0 1 600,145" stroke="#7f9cf5"/>
  </g>

  <!-- phase labels -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="600" text-anchor="middle">
    <g fill="#4fd1c5">
      <text x="830" y="185" font-size="30">INHALE</text>
      <text x="830" y="220" font-size="44">4</text>
    </g>
    <g fill="#f6ad55">
      <text x="600" y="560" font-size="30">HOLD</text>
      <text x="600" y="600" font-size="44">7</text>
    </g>
    <g fill="#7f9cf5">
      <text x="370" y="185" font-size="30">EXHALE</text>
      <text x="370" y="220" font-size="44">8</text>
    </g>
  </g>

  <!-- wordmark -->
  <text x="600" y="330" text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-size="46" font-weight="300" letter-spacing="6" fill="#0f2027">4·7·8</text>
</svg>
